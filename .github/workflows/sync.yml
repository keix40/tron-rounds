name: sync-rounds

# Backup only — GitHub schedule is often delayed and may not run every minute.
# Primary: external cron (cron-job.org) POSTing /api/sync every 1 minute. See README.
on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production sync
        run: |
          curl -fsS -X POST "${{ secrets.SYNC_URL }}" \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
            -H "Content-Type: application/json"
